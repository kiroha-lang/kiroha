name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish (empty builds the current revision without publishing)
        type: string
        required: false
        default: ''

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      source_ref: ${{ inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - name: Select compatible macOS SDK
        if: runner.os == 'macOS'
        run: |
          # pg_query 5's fallback strchrnul conflicts with SDK 15.4+.
          # Xcode 16.2's SDK retains the audited parser and macOS 13 target.
          developer_dir=/Applications/Xcode_16.2.app/Contents/Developer
          test -d "$developer_dir"
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          echo "SDKROOT=$(DEVELOPER_DIR="$developer_dir" xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}
      - uses: actions/cache@v4
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: release-rust1.96-${{ matrix.runner }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: release-rust1.96-${{ matrix.runner }}-${{ matrix.target }}-
      - name: Install build tools
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            # The Azure mirror stalled repeatedly on the libclang archive.
            for kiroha_sources in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
              if [[ -f "$kiroha_sources" ]]; then
                sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' "$kiroha_sources"
              fi
            done
            sudo apt-get update
            sudo apt-get install -y libclang-dev
          else
            # prost-build 0.10's bundled protobuf predates CMake 4. Use the
            # native protoc rather than rebuilding that old CMake project.
            brew install llvm protobuf
            echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
            echo 'PROTOC_NO_VENDOR=1' >> "$GITHUB_ENV"
            echo "PROTOC=$(brew --prefix protobuf)/bin/protoc" >> "$GITHUB_ENV"
          fi
      - name: Check release version
        shell: bash
        run: |
          version=$(awk -F '"' '/^version = / {print $2; exit}' Cargo.toml)
          if [[ -n "$RELEASE_TAG" ]]; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            test "$RELEASE_TAG" = "v$version"
          fi
      - run: cargo build --release --locked --target '${{ matrix.target }}'
      - name: Smoke test native binary
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/kiroha"
          "$bin" --version
          "$bin" conformance spec.md --json
          printf '0.1 + 0.2' | "$bin" run - --json
      - name: Package
        shell: bash
        run: |
          mkdir -p stage dist
          cp 'target/${{ matrix.target }}/release/kiroha' LICENSE stage/
          tar -czf 'dist/kiroha-${{ matrix.target }}.tar.gz' -C stage kiroha LICENSE
      - name: Test installer with native system Bash
        run: |
          /bin/bash -n install.sh
          KIROHA_TEST_BASH=/bin/bash python3 -m unittest discover -s tests -p test_install.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: kiroha-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag != '' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Prepare checksums and installer
        run: |
          cp install.sh dist/install.sh
          cd dist
          sha256sum kiroha-*.tar.gz install.sh > SHA256SUMS
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          Kiroha 0.7.0 / Web1 reference implementation.

          PostgreSQL, MySQL 8.4 and MariaDB 11.4 share the db/sql/tx API.
          Host pool configuration selects the backend; leases, deadlines, transaction
          poisoning, cleanup and outcomes use the same runtime machinery.
          Exact decimal bindings avoid host floats. SQL dialects and native type
          differences are documented at https://kiroha-lang.github.io/kiroha/guides/databases/.
          The Kiroha Codex plugin 0.3 includes the matching database guidance.

          Install the latest verified binary (Linux/WSL or macOS, x86_64/ARM64):

          ```sh
          curl -fsSL https://github.com/kiroha-lang/kiroha/releases/latest/download/install.sh | bash
          ```

          The installer verifies SHA-256 and defaults to `~/.local/bin`.
          Pin a version with `bash -s -- --version 0.7.0`, or set `KIROHA_INSTALL_DIR`.
          Linux binaries require glibc 2.35+; macOS binaries target macOS 13+.
          See the repository's installation and language documentation for details.
          EOF
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft \
            --title "Kiroha ${RELEASE_TAG#v}" --notes-file release-notes.md
          gh release edit "$RELEASE_TAG" --draft=false --latest
