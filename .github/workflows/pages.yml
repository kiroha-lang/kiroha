name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'assets/branding/**'
      - 'docs/**'
      - 'examples/**'
      - 'spec.md'
      - 'Cargo.toml'
      - 'README.md'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'scripts/docs/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'assets/branding/**'
      - 'docs/**'
      - 'examples/**'
      - 'spec.md'
      - 'Cargo.toml'
      - 'README.md'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'scripts/docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.ref || 'github-pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: python -m pip install -r requirements-docs.txt
      - name: Build documentation
        run: python -m mkdocs build --strict
      - name: Check pages and internal links
        run: python scripts/docs/check_site.py site
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: verify-rust1.96-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: verify-rust1.96-${{ runner.os }}-${{ runner.arch }}-
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: Check beginner programs with this revision
        run: |
          cargo build --release --locked
          python scripts/docs/check_examples.py --kiroha target/release/kiroha
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
