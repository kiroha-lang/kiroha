[package]
name = "kiri"
version = "0.3.0"
edition = "2021"
description = "Reference implementation of the Kiri 0.3.0 / Web1 language and runtime"
license = "MIT"

[lib]
name = "kiri"
path = "src/lib.rs"

[[bin]]
name = "kiri"
path = "src/main.rs"

[dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
base64 = "0.22"
flate2 = "1"
getrandom = "0.2"
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "macros", "signal", "sync"] }
tokio-util = "0.7"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
webpki-roots = "0.26"
httparse = "1"
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.13"
pg_query = "5"
signal-hook-registry = "1.4"
postgres-types = "0.2"
rustix = { version = "0.38", features = ["fs"] }
libc = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
rcgen = "0.13"
flate2 = "1"

[profile.release]
debug = 1
